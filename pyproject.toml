[project]
name = "mesquareassistantbot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "khanh19", email = "khanh02092000@gmail.com" }
]
requires-python = ">=3.15"
dependencies = [
    "asyncpg>=0.32.0",
    "docling>=2.151.1",
    "fastapi[standard]>=0.162.2",
    "langchain>=1.4.9",
    "langchain-openai>=1.7.4",
    "langchain-text-splitters>=1.1.3",
    "openai>=3.48.0",
    "pgvector>=0.5.1",
    "python-dotenv>=1.2.4",
    "sqlalchemy[asyncio]>=2.1.9",
    "streamlit>=1.67.0",
    "uvicorn>=0.54.0",
]



[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
