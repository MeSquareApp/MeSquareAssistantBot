[project]
name = "mesquareassistantbot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "khanh19", email = "khanh02092000@gmail.com" }
]
requires-python = ">=3.15"
dependencies = [
    "fastapi>=0.162.2",
    "langchain>=1.4.9",
    "langchain-openai>=1.7.4",
    "openai>=3.48.0",
    "python-dotenv>=1.2.4",
    "streamlit>=1.67.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
mesquareassistantbot = "mesquareassistantbot:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
